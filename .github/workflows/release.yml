name: Build and Release Windows Package

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'
        cache: npm

    - name: Validate release tag
      shell: pwsh
      run: |
        node scripts/release-contract.mjs --tag "$env:GITHUB_REF_NAME"
        $version = node -p "require('./package.json').version"
        $productName = node -p "require('./package.json').productName || require('./package.json').name"
        "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
        "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
        "RELEASE_PRODUCT_NAME=$productName" >> $env:GITHUB_ENV

    - name: Refuse to overwrite an existing release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $releaseJson = gh release list `
          --repo $env:GITHUB_REPOSITORY `
          --limit 1000 `
          --json tagName,isDraft
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $existing = @(
          @($releaseJson | ConvertFrom-Json) | Where-Object {
            $_.tagName -eq $env:RELEASE_TAG
          }
        )
        if ($existing.Count -gt 0) {
          throw "Release $env:RELEASE_TAG already exists. Refusing to overwrite it."
        }

    - name: Install locked dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Run type checks
      run: npm run lint

    - name: Validate signed Tencent COS update configuration
      env:
        OPENFLOW_UPDATE_CHANNEL_URL: ${{ vars.OPENFLOW_UPDATE_CHANNEL_URL }}
        OPENFLOW_UPDATE_PUBLIC_KEY: ${{ vars.OPENFLOW_UPDATE_PUBLIC_KEY }}
        OPENFLOW_SENTRY_DSN: ${{ vars.OPENFLOW_SENTRY_DSN }}
        OPENFLOW_DIAGNOSTICS_UPLOAD_INTERVAL_MINUTES: ${{ vars.OPENFLOW_DIAGNOSTICS_UPLOAD_INTERVAL_MINUTES }}
      run: node scripts/prepare-update-config.mjs --require

    - name: Build the application without publishing
      env:
        OPENFLOW_UPDATE_CHANNEL_URL: ${{ vars.OPENFLOW_UPDATE_CHANNEL_URL }}
        OPENFLOW_UPDATE_PUBLIC_KEY: ${{ vars.OPENFLOW_UPDATE_PUBLIC_KEY }}
        OPENFLOW_SENTRY_DSN: ${{ vars.OPENFLOW_SENTRY_DSN }}
        OPENFLOW_DIAGNOSTICS_UPLOAD_INTERVAL_MINUTES: ${{ vars.OPENFLOW_DIAGNOSTICS_UPLOAD_INTERVAL_MINUTES }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ vars.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      run: npm run build

    - name: Validate release artifacts
      run: node scripts/release-contract.mjs --tag "$env:GITHUB_REF_NAME" --artifacts build-dist

    - name: Stage immutable release files on Tencent COS
      env:
        TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
        TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        TENCENT_COS_SESSION_TOKEN: ${{ secrets.TENCENT_COS_SESSION_TOKEN }}
        TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
        TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
        OPENFLOW_COS_PUBLIC_BASE_URL: ${{ vars.OPENFLOW_COS_PUBLIC_BASE_URL }}
        OPENFLOW_COS_PREFIX: ${{ vars.OPENFLOW_COS_PREFIX }}
        OPENFLOW_COS_CHUNK_SIZE_MB: ${{ vars.OPENFLOW_COS_CHUNK_SIZE_MB }}
        OPENFLOW_COS_CHUNK_PARALLEL: ${{ vars.OPENFLOW_COS_CHUNK_PARALLEL }}
        OPENFLOW_COS_CHUNK_RETRIES: ${{ vars.OPENFLOW_COS_CHUNK_RETRIES }}
        OPENFLOW_COS_OPERATION_ATTEMPTS: ${{ vars.OPENFLOW_COS_OPERATION_ATTEMPTS }}
        OPENFLOW_COS_REQUEST_TIMEOUT_MS: ${{ vars.OPENFLOW_COS_REQUEST_TIMEOUT_MS }}
        OPENFLOW_COS_FULL_READBACK: ${{ vars.OPENFLOW_COS_FULL_READBACK }}
        OPENFLOW_COS_USE_ACCELERATE: ${{ vars.OPENFLOW_COS_USE_ACCELERATE }}
        OPENFLOW_RELEASE_PRIVATE_KEY: ${{ secrets.OPENFLOW_RELEASE_PRIVATE_KEY }}
        OPENFLOW_UPDATE_PUBLIC_KEY: ${{ vars.OPENFLOW_UPDATE_PUBLIC_KEY }}
      run: node scripts/sync-release-to-cos.mjs --stage build-dist

    - name: Create one draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create $env:RELEASE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --verify-tag `
          --target $env:GITHUB_SHA `
          --title "OpenFlow $env:RELEASE_VERSION" `
          --generate-notes `
          --draft
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "RELEASE_CREATED=true" >> $env:GITHUB_ENV

    - name: Upload all release assets to the existing draft
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $installer = "build-dist/$env:RELEASE_PRODUCT_NAME-Setup-$env:RELEASE_VERSION.exe"
        $blockmap = "$installer.blockmap"
        $manifest = "build-dist/latest.yml"
        $extensionVersion = (Get-Content -Raw -Encoding UTF8 "build-dist/extension-release.json" | ConvertFrom-Json).extensionVersion
        $extensionArchive = "build-dist/OpenFlow-Chrome-Extension-$extensionVersion.zip"
        gh release upload $env:RELEASE_TAG $installer $blockmap $manifest $extensionArchive "build-dist/extension-release.json" "build-dist/release.json" `
          --repo $env:GITHUB_REPOSITORY
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify the draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $expectedAssets = @(
          "$env:RELEASE_PRODUCT_NAME-Setup-$env:RELEASE_VERSION.exe",
          "$env:RELEASE_PRODUCT_NAME-Setup-$env:RELEASE_VERSION.exe.blockmap",
          "latest.yml",
          "OpenFlow-Chrome-Extension-$((Get-Content -Raw -Encoding UTF8 'build-dist/extension-release.json' | ConvertFrom-Json).extensionVersion).zip",
          "extension-release.json",
          "release.json"
        ) | Sort-Object
        $release = gh release view $env:RELEASE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --json tagName,isDraft,assets | ConvertFrom-Json
        $actualAssets = @($release.assets.name) | Sort-Object
        if ($release.tagName -ne $env:RELEASE_TAG -or -not $release.isDraft) {
          throw "Draft release identity check failed."
        }
        if (Compare-Object $expectedAssets $actualAssets) {
          throw "Release assets are incomplete or unexpected."
        }
        $invalidAssets = @($release.assets | Where-Object {
          $_.state -ne "uploaded" -or $_.size -le 0
        })
        if ($invalidAssets.Count -gt 0) {
          throw "One or more release assets are empty or not fully uploaded."
        }

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: windows-build-${{ github.ref_name }}
        path: |
          build-dist/*.exe
          build-dist/*.blockmap
          build-dist/latest.yml
          build-dist/OpenFlow-Chrome-Extension-*.zip
          build-dist/extension-release.json
          build-dist/release.json
        if-no-files-found: error
        retention-days: 14

    - name: Publish and verify the release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $expectedAssets = @(
          "$env:RELEASE_PRODUCT_NAME-Setup-$env:RELEASE_VERSION.exe",
          "$env:RELEASE_PRODUCT_NAME-Setup-$env:RELEASE_VERSION.exe.blockmap",
          "latest.yml",
          "OpenFlow-Chrome-Extension-$((Get-Content -Raw -Encoding UTF8 'build-dist/extension-release.json' | ConvertFrom-Json).extensionVersion).zip",
          "extension-release.json",
          "release.json"
        ) | Sort-Object
        gh release edit $env:RELEASE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --draft=false `
          --latest
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $published = gh release view $env:RELEASE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --json isDraft,assets | ConvertFrom-Json
        $invalidPublishedAssets = @($published.assets | Where-Object {
          $_.state -ne "uploaded" -or $_.size -le 0
        })
        if (
          $published.isDraft -or
          (Compare-Object $expectedAssets @($published.assets.name | Sort-Object)) -or
          $invalidPublishedAssets.Count -gt 0
        ) {
          throw "Published release verification failed."
        }

    - name: Promote the verified release on Tencent COS
      env:
        TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
        TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        TENCENT_COS_SESSION_TOKEN: ${{ secrets.TENCENT_COS_SESSION_TOKEN }}
        TENCENT_COS_BUCKET: ${{ vars.TENCENT_COS_BUCKET }}
        TENCENT_COS_REGION: ${{ vars.TENCENT_COS_REGION }}
        OPENFLOW_COS_PUBLIC_BASE_URL: ${{ vars.OPENFLOW_COS_PUBLIC_BASE_URL }}
        OPENFLOW_COS_PREFIX: ${{ vars.OPENFLOW_COS_PREFIX }}
        OPENFLOW_COS_CHUNK_SIZE_MB: ${{ vars.OPENFLOW_COS_CHUNK_SIZE_MB }}
        OPENFLOW_COS_CHUNK_PARALLEL: ${{ vars.OPENFLOW_COS_CHUNK_PARALLEL }}
        OPENFLOW_COS_CHUNK_RETRIES: ${{ vars.OPENFLOW_COS_CHUNK_RETRIES }}
        OPENFLOW_COS_OPERATION_ATTEMPTS: ${{ vars.OPENFLOW_COS_OPERATION_ATTEMPTS }}
        OPENFLOW_COS_REQUEST_TIMEOUT_MS: ${{ vars.OPENFLOW_COS_REQUEST_TIMEOUT_MS }}
        OPENFLOW_COS_FULL_READBACK: ${{ vars.OPENFLOW_COS_FULL_READBACK }}
        OPENFLOW_COS_USE_ACCELERATE: ${{ vars.OPENFLOW_COS_USE_ACCELERATE }}
        OPENFLOW_RELEASE_PRIVATE_KEY: ${{ secrets.OPENFLOW_RELEASE_PRIVATE_KEY }}
        OPENFLOW_UPDATE_PUBLIC_KEY: ${{ vars.OPENFLOW_UPDATE_PUBLIC_KEY }}
      run: node scripts/sync-release-to-cos.mjs --promote build-dist/release.json

    - name: Remove this run's failed draft
      if: ${{ failure() && env.RELEASE_CREATED == 'true' }}
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $releaseJson = gh release view $env:RELEASE_TAG `
          --repo $env:GITHUB_REPOSITORY `
          --json isDraft 2>$null
        if ($LASTEXITCODE -ne 0) { exit 0 }

        $release = $releaseJson | ConvertFrom-Json
        if ($release.isDraft) {
          gh release delete $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
